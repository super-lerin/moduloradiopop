<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Pop Goiaia - Player Web</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#fb7185', // rose-400
                            DEFAULT: '#f43f5e', // rose-500
                            dark: '#e11d48', // rose-600
                        },
                        surface: {
                            900: '#0f172a', // slate-900
                            800: '#1e293b', // slate-800
                            700: '#334155', // slate-700
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #f43f5e;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }

        /* Vinyl Spin Animation Class */
        .vinyl-spin {
            animation: spin 10s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body class="bg-surface-900 text-white min-h-screen flex flex-col font-sans selection:bg-brand selection:text-white overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 glass-panel border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-light to-brand flex items-center justify-center shadow-lg shadow-brand/20">
                    <i class="fa-solid fa-tower-broadcast text-white text-xs"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight">Rádio Pop Goiaia</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">Jornalista • Músico • Videomaker • IA</p>
                </div>
            </div>
            
            <nav class="hidden md:flex gap-6 text-sm font-medium text-slate-300">
                <a href="#" class="hover:text-brand transition-colors">Rádio</a>
                <a href="#" class="hover:text-brand transition-colors">Playlist</a>
                <a href="#" class="hover:text-brand transition-colors">Sobre</a>
            </nav>

            <button class="md:hidden text-slate-300 hover:text-white">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow pb-32 pt-8 px-4">
        <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Now Playing (Hero) -->
            <section class="lg:col-span-5 flex flex-col gap-6">
                <div class="relative group">
                    <!-- Album Art Container -->
                    <div class="aspect-square w-full rounded-2xl overflow-hidden shadow-2xl shadow-black/50 relative bg-surface-800 border border-white/5">
                        <!-- Placeholder Image representing the vinyl/dark aesthetic -->
                        <img id="current-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=1000&auto=format&fit=crop" 
                             alt="Album Art" 
                             class="w-full h-full object-cover opacity-90 transition-transform duration-700 group-hover:scale-105">
                        
                        <!-- Overlay Gradient -->
                        <div class="absolute inset-0 bg-gradient-to-t from-surface-900 via-transparent to-transparent opacity-60"></div>

                        <!-- Live Badge -->
                        <div class="absolute top-4 right-4 bg-brand/90 backdrop-blur-md text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg flex items-center gap-2 animate-pulse-slow">
                            <span class="w-2 h-2 bg-white rounded-full"></span> AO VIVO
                        </div>
                    </div>
                </div>

                <!-- Track Info -->
                <div class="space-y-2">
                    <h2 id="current-title" class="text-2xl sm:text-3xl font-bold text-white leading-tight">A Felicidade (É Guardada pelos Cães)</h2>
                    <p id="current-artist" class="text-lg text-brand-light font-medium">Claudio Salles</p>
                    <div class="flex items-center gap-2 text-sm text-slate-400 mt-2">
                        <span class="bg-surface-800 px-2 py-0.5 rounded border border-white/5">Single</span>
                        <span>•</span>
                        <span>2026</span>
                    </div>
                </div>
            </section>

            <!-- Right Column: Controls & Playlist -->
            <section class="lg:col-span-7 flex flex-col gap-6">
                
                <!-- Player Card -->
                <div class="glass-panel rounded-2xl p-6 sm:p-8 shadow-xl">
                    
                    <!-- Progress Bar -->
                    <div class="mb-6 space-y-2">
                        <div class="flex justify-between text-xs font-mono text-slate-400">
                            <span id="current-time">0:00</span>
                            <span id="total-time">3:45</span>
                        </div>
                        <div class="relative w-full h-1.5 bg-surface-700 rounded-full cursor-pointer group" id="progress-container">
                            <div id="progress-fill" class="absolute top-0 left-0 h-full bg-brand rounded-full w-0 transition-all duration-300"></div>
                            <div id="progress-handle" class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow opacity-0 group-hover:opacity-100 transition-opacity left-0"></div>
                        </div>
                    </div>

                    <!-- Main Controls -->
                    <div class="flex items-center justify-center gap-8 mb-8">
                        <button class="text-slate-400 hover:text-white transition-colors" onclick="prevTrack()">
                            <i class="fa-solid fa-backward-step text-xl"></i>
                        </button>
                        
                        <button id="play-btn" class="w-16 h-16 rounded-full bg-white text-brand hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(255,255,255,0.3)] flex items-center justify-center">
                            <i class="fa-solid fa-play text-2xl ml-1"></i>
                        </button>
                        
                        <button class="text-slate-400 hover:text-white transition-colors" onclick="nextTrack()">
                            <i class="fa-solid fa-forward-step text-xl"></i>
                        </button>
                    </div>

                    <!-- Volume & Visualizer Row -->
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3 flex-1">
                            <button id="mute-btn" class="text-slate-400 hover:text-white transition-colors w-6">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <input type="range" id="volume-slider" min="0" max="100" value="80" class="w-full h-1 bg-surface-700 rounded-lg appearance-none cursor-pointer [&::-webkit-slider-thumb]:bg-slate-400 [&::-webkit-slider-thumb]:shadow-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3">
                        </div>
                        
                        <div class="flex items-center gap-2 text-xs text-slate-400 font-medium">
                            <div class="flex items-end gap-0.5 h-4">
                                <div class="w-1 bg-brand animate-[bounce_1s_infinite] h-2"></div>
                                <div class="w-1 bg-brand animate-[bounce_1.2s_infinite] h-4"></div>
                                <div class="w-1 bg-brand animate-[bounce_0.8s_infinite] h-3"></div>
                                <div class="w-1 bg-brand animate-[bounce_1.1s_infinite] h-1"></div>
                            </div>
                            <span>Visualização em tempo real</span>
                        </div>
                    </div>
                </div>

                <!-- Playlist Section -->
                <div class="flex-1">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-music text-brand"></i> Playlist da Rádio Pop Goiaia
                    </h3>
                    
                    <div class="glass-panel rounded-2xl overflow-hidden">
                        <div class="divide-y divide-white/5 max-h-[400px] overflow-y-auto custom-scrollbar" id="playlist-container">
                            <!-- Playlist Items will be injected here by JS -->
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- Sticky Bottom Player (Mini Player) -->
    <footer class="fixed bottom-0 left-0 right-0 bg-surface-800/90 backdrop-blur-xl border-t border-white/10 z-40 px-4 py-3 shadow-2xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            
            <!-- Mini Track Info -->
            <div class="flex items-center gap-3 w-1/3 min-w-0">
                <img id="mini-art" src="" alt="" class="w-10 h-10 rounded-md object-cover bg-surface-700 hidden sm:block">
                <div class="min-w-0">
                    <h4 id="mini-title" class="text-sm font-semibold text-white truncate">Selecione uma música</h4>
                    <p id="mini-artist" class="text-xs text-slate-400 truncate">-</p>
                </div>
            </div>

            <!-- Mini Controls -->
            <div class="flex items-center justify-center gap-6 w-1/3">
                <button class="text-slate-400 hover:text-white transition-colors" onclick="prevTrack()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="mini-play-btn" class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center hover:bg-brand-dark transition-colors shadow-lg shadow-brand/30">
                    <i class="fa-solid fa-play text-xs ml-0.5"></i>
                </button>
                <button class="text-slate-400 hover:text-white transition-colors" onclick="nextTrack()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <!-- Mini Volume -->
            <div class="flex items-center justify-end gap-2 w-1/3">
                <i class="fa-solid fa-volume-high text-slate-400 text-xs"></i>
                <div class="w-20 h-1 bg-surface-700 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 w-3/4"></div>
                </div>
            </div>

        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Data Structure
        const playlistData = [
            {
                id: 1,
                title: "A Felicidade (É Guardada pelos Cães)",
                artist: "Claudio Salles",
                year: "2026",
                duration: "3:45",
                cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: 2,
                title: "Sabe Com Quem Está Falando?",
                artist: "Claudio Salles",
                year: "2026",
                duration: "4:12",
                cover: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: 3,
                title: "Ecos Marinhos",
                artist: "Banda Oceano",
                year: "2025",
                duration: "3:20",
                cover: "https://images.unsplash.com/photo-1459749411177-287ce3276911?q=80&w=400&auto=format&fit=crop"
            },
            {
                id: 4,
                title: "Noite de Neon",
                artist: "Synthwave Boy",
                year: "2026",
                duration: "5:01",
                cover: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=400&auto=format&fit=crop"
            },
             {
                id: 5,
                title: "Café e Violão",
                artist: "Acústico Project",
                year: "2024",
                duration: "2:55",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=400&auto=format&fit=crop"
            }
        ];

        // State
        let currentTrackIndex = 0;
        let isPlaying = false;
        let progressInterval;
        let currentProgress = 0; // 0 to 100

        // DOM Elements
        const playBtn = document.getElementById('play-btn');
        const miniPlayBtn = document.getElementById('mini-play-btn');
        const progressFill = document.getElementById('progress-fill');
        const progressHandle = document.getElementById('progress-handle');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const playlistContainer = document.getElementById('playlist-container');
        
        // Main Display Elements
        const mainTitle = document.getElementById('current-title');
        const mainArtist = document.getElementById('current-artist');
        const mainArt = document.getElementById('current-art');
        
        // Mini Display Elements
        const miniTitle = document.getElementById('mini-title');
        const miniArtist = document.getElementById('mini-artist');
        const miniArt = document.getElementById('mini-art');

        // Initialize
        function init() {
            renderPlaylist();
            loadTrack(currentTrackIndex);
            setupEventListeners();
        }

        // Render Playlist List
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlistData.forEach((track, index) => {
                const isActive = index === currentTrackIndex;
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-4 hover:bg-white/5 transition-colors cursor-pointer group ${isActive ? 'bg-white/5 border-l-2 border-brand' : ''}`;
                item.onclick = () => playTrack(index);
                
                item.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="relative w-10 h-10 flex-shrink-0">
                            <img src="${track.cover}" class="w-full h-full rounded object-cover ${isActive && isPlaying ? 'vinyl-spin' : ''}">
                            ${isActive && isPlaying ? '<div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded"><i class="fa-solid fa-chart-simple text-brand text-xs animate-pulse"></i></div>' : ''}
                        </div>
                        <div class="min-w-0">
                            <h4 class="text-sm font-semibold text-white truncate ${isActive ? 'text-brand' : ''}">${track.title}</h4>
                            <p class="text-xs text-slate-400 truncate">${track.artist}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-500 font-mono">${track.duration}</span>
                        <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-brand hover:bg-brand/10 transition-all">
                            <i class="fa-solid fa-play text-xs"></i>
                        </button>
                    </div>
                `;
                playlistContainer.appendChild(item);
            });
        }

        // Load Track Data
        function loadTrack(index) {
            const track = playlistData[index];
            
            // Update Main UI
            mainTitle.textContent = track.title;
            mainArtist.textContent = track.artist;
            mainArt.src = track.cover;
            totalTimeEl.textContent = track.duration;
            
            // Update Mini UI
            miniTitle.textContent = track.title;
            miniArtist.textContent = track.artist;
            miniArt.src = track.cover;

            // Reset Progress
            currentProgress = 0;
            updateProgressBar();
            currentTimeEl.textContent = "0:00";

            // Re-render list to update active state styling
            renderPlaylist();
        }

        // Play/Pause Logic
        function togglePlay() {
            isPlaying = !isPlaying;
            updatePlayButtons();
            
            if (isPlaying) {
                startProgressSimulation();
                // Add spin class to images
                document.querySelectorAll('img').forEach(img => img.classList.add('vinyl-spin'));
            } else {
                stopProgressSimulation();
                // Remove spin class
                document.querySelectorAll('img').forEach(img => img.classList.remove('vinyl-spin'));
            }
            renderPlaylist(); // To update playing icon in list
        }

        function playTrack(index) {
            currentTrackIndex = index;
            loadTrack(index);
            if (!isPlaying) {
                togglePlay();
            } else {
                // If already playing, just restart progress simulation for new track
                stopProgressSimulation();
                startProgressSimulation();
                renderPlaylist();
            }
        }

        function nextTrack() {
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= playlistData.length) nextIndex = 0;
            playTrack(nextIndex);
        }

        function prevTrack() {
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) prevIndex = playlistData.length - 1;
            playTrack(prevIndex);
        }

        function updatePlayButtons() {
            const iconClass = isPlaying ? 'fa-pause' : 'fa-play';
            const mlClass = isPlaying ? 'ml-0' : 'ml-1'; // adjust padding for play triangle
            
            playBtn.innerHTML = `<i class="fa-solid ${iconClass} text-2xl ${mlClass}"></i>`;
            miniPlayBtn.innerHTML = `<i class="fa-solid ${iconClass} text-xs ${mlClass}"></i>`;
        }

        // Progress Simulation (Fake Timer)
        function startProgressSimulation() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                currentProgress += 0.5; // Speed of simulation
                if (currentProgress >= 100) {
                    nextTrack();
                } else {
                    updateProgressBar();
                    updateTimeDisplay();
                }
            }, 100);
        }

        function stopProgressSimulation() {
            clearInterval(progressInterval);
        }

        function updateProgressBar() {
            progressFill.style.width = `${currentProgress}%`;
            progressHandle.style.left = `${currentProgress}%`;
        }

        function updateTimeDisplay() {
            // Parse total duration "3:45" -> seconds
            const totalParts = totalTimeEl.textContent.split(':');
            const totalSeconds = parseInt(totalParts[0]) * 60 + parseInt(totalParts[1]);
            
            const currentSeconds = Math.floor((currentProgress / 100) * totalSeconds);
            const mins = Math.floor(currentSeconds / 60);
            const secs = currentSeconds % 60;
            
            currentTimeEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Event Listeners
        function setupEventListeners() {
            playBtn.addEventListener('click', togglePlay);
            miniPlayBtn.addEventListener('click', togglePlay);
            
            // Volume Slider Interaction (Visual only for demo)
            const volSlider = document.getElementById('volume-slider');
            volSlider.addEventListener('input', (e) => {
                // In a real app, this would set audio.volume
                console.log("Volume:", e.target.value);
            });

            // Progress Bar Click
            const progressContainer = document.getElementById('progress-container');
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                currentProgress = (clickX / width) * 100;
                updateProgressBar();
                updateTimeDisplay();
            });
        }

        // Run
        init();

    </script>
</body>
</html>
