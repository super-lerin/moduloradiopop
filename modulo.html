<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Rádio Web - Troca Sem Interrupção</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animações */
        .bar { width: 4px; background: #6366f1; border-radius: 2px; animation: equalize 1s infinite ease-in-out; }
        @keyframes equalize { 0%, 100% { height: 10px; } 50% { height: 25px; } }
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.5s; }
        .bar:nth-child(4) { animation-delay: 0.2s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        
        .live-pulse { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        /* Transição suave de volume */
        audio { transition: volume 0.5s ease; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- PLAYER MODULE -->
    <div id="radio-player-widget" class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-200 relative">
        
        <!-- Header -->
        <div class="relative h-64 bg-gradient-to-br from-indigo-600 to-purple-700 flex flex-col items-center justify-center text-white p-6">
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>

            <div class="relative z-10 mb-4 group cursor-pointer">
                <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white/20 shadow-lg transition-transform duration-500 group-hover:scale-105">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=400&auto=format&fit=crop" alt="Album Art" class="w-full h-full object-cover" id="current-art">
                </div>
                <div class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full flex items-center gap-1 live-pulse z-20">
                    <span class="w-2 h-2 bg-white rounded-full"></span> AO VIVO
                </div>
            </div>

            <div class="text-center z-10">
                <h2 class="text-xl font-bold tracking-wide" id="station-name">Minha Rádio Web</h2>
                <p class="text-indigo-200 text-sm mt-1" id="stream-status">Pronto para tocar</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="p-6 bg-white">
            <div class="mb-6 text-center">
                <h3 class="text-gray-900 font-bold text-lg truncate" id="track-title">Selecione uma Playlist</h3>
                <p class="text-gray-500 text-sm truncate" id="track-artist">Troque abaixo sem parar o som</p>
            </div>

            <div class="flex items-center justify-center gap-6 mb-6">
                <button onclick="adjustVolume(-0.1)" class="text-gray-400 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-indigo-50">
                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                </button>

                <button id="play-btn" class="w-16 h-16 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-200 transition-all transform hover:scale-105 active:scale-95">
                    <i data-lucide="play" class="w-8 h-8 fill-current ml-1" id="play-icon"></i>
                </button>

                <button onclick="adjustVolume(0.1)" class="text-gray-400 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-indigo-50">
                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="flex items-center gap-3 mb-6 px-2">
                <i data-lucide="volume-1" class="w-4 h-4 text-gray-400"></i>
                <input type="range" min="0" max="1" step="0.01" value="0.8" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" id="volume-slider">
                <i data-lucide="volume-2" class="w-4 h-4 text-gray-400"></i>
            </div>

            <div id="visualizer" class="h-8 flex items-center justify-center gap-1 mb-4 opacity-0 transition-opacity duration-300">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>

            <div class="flex justify-between border-t border-gray-100 pt-4">
                <button onclick="togglePlaylist()" class="flex items-center gap-2 text-sm text-gray-600 hover:text-indigo-600 transition-colors">
                    <i data-lucide="list-music" class="w-4 h-4"></i> Playlists
                </button>
            </div>
        </div>

        <!-- Playlist Drawer -->
        <div id="playlist-drawer" class="hidden bg-gray-50 border-t border-gray-200 max-h-48 overflow-y-auto custom-scrollbar">
            <ul class="divide-y divide-gray-100" id="playlist-items">
                <!-- Populado via JS -->
            </ul>
        </div>
    </div>

    <!-- SCRIPT LÓGICO -->
    <script>
        lucide.createIcons();

        // Configuração das Fontes (Streams ou Arquivos)
        const sources = [
            { name: "Pop Hits 24/7", url: "https://stream.zeno.fm/zeno.mp3", type: "stream" },
            { name: "Jazz Lounge", url: "https://jazz-wr04.ice.infomaniac.ch/jazz-wr04.mp3", type: "stream" },
            { name: "Classical Radio", url: "https://media-ssl.musicradio.com/ClassicFM", type: "stream" }
        ];

        let currentSourceIndex = 0;
        let isPlaying = false;
        let masterVolume = 0.8;

        // Criação dos dois elementos de áudio para crossfade
        const audioA = new Audio();
        const audioB = new Audio();
        
        // Define qual está ativo inicialmente
        let activeAudio = audioA;
        let inactiveAudio = audioB;

        // Inicialização
        function init() {
            renderPlaylist();
            setupAudioEvents(audioA);
            setupAudioEvents(audioB);
            
            // Carrega a primeira fonte no áudio A (mas não toca ainda)
            activeAudio.src = sources[0].url;
            activeAudio.volume = 0; // Começa mudo para preparar o fade in
        }

        function setupAudioEvents(audioEl) {
            audioEl.addEventListener('error', (e) => {
                console.error("Erro no stream:", e);
                document.getElementById('stream-status').innerText = "Erro de conexão";
            });
        }

        // Função Principal de Troca de Playlist (Crossfade)
        function switchSource(index) {
            if (index === currentSourceIndex && isPlaying) return; // Já está tocando esta
            
            currentSourceIndex = index;
            const newUrl = sources[index].url;
            
            document.getElementById('track-title').innerText = "Trocando...";
            document.getElementById('stream-status').innerText = "Carregando nova fonte...";

            // 1. Prepara o áudio inativo com a nova URL
            inactiveAudio.src = newUrl;
            inactiveAudio.volume = 0; // Garante que começa mudo
            inactiveAudio.play().then(() => {
                // 2. Se tocou com sucesso, faz o crossfade
                performCrossfade();
            }).catch(e => {
                console.error("Falha ao carregar nova fonte", e);
                document.getElementById('track-title').innerText = "Falha ao trocar";
            });
        }

        function performCrossfade() {
            const duration = 1000; // 1 segundo de fade
            const steps = 20;
            const interval = duration / steps;
            const volStep = masterVolume / steps;

            let currentVol = 0;

            const fadeInterval = setInterval(() => {
                currentVol += volStep;
                
                // Aumenta volume do novo
                if(inactiveAudio.volume < masterVolume) inactiveAudio.volume += volStep;
                
                // Diminui volume do antigo
                if(activeAudio.volume > 0) activeAudio.volume -= volStep;

                if (currentVol >= masterVolume) {
                    clearInterval(fadeInterval);
                    
                    // Finaliza a troca
                    activeAudio.pause();
                    activeAudio.currentTime = 0;
                    
                    // Inverte os papéis: o inativo vira o ativo
                    let temp = activeAudio;
                    activeAudio = inactiveAudio;
                    inactiveAudio = temp;
                    
                    // Garante volumes corretos após troca
                    activeAudio.volume = masterVolume;
                    inactiveAudio.volume = 0;
                    
                    updateUI(true);
                    document.getElementById('track-title').innerText = sources[currentSourceIndex].name;
                    document.getElementById('track-artist').innerText = "Ao Vivo";
                }
            }, interval);
        }

        // Controles Básicos
        document.getElementById('play-btn').addEventListener('click', () => {
            if (isPlaying) {
                // Pausa ambos
                activeAudio.pause();
                inactiveAudio.pause();
                isPlaying = false;
                updateUI(false);
            } else {
                // Toca o ativo atual
                if(activeAudio.src) {
                    activeAudio.volume = masterVolume;
                    activeAudio.play();
                    isPlaying = true;
                    updateUI(true);
                    document.getElementById('track-title').innerText = sources[currentSourceIndex].name;
                } else {
                    switchSource(0); // Carrega a primeira se nada estiver carregado
                }
            }
        });

        function adjustVolume(change) {
            masterVolume += change;
            if (masterVolume > 1) masterVolume = 1;
            if (masterVolume < 0) masterVolume = 0;
            
            document.getElementById('volume-slider').value = masterVolume;
            activeAudio.volume = masterVolume;
        }

        document.getElementById('volume-slider').addEventListener('input', (e) => {
            masterVolume = parseFloat(e.target.value);
            activeAudio.volume = masterVolume;
        });

        function updateUI(playing) {
            const icon = document.getElementById('play-icon');
            const visualizer = document.getElementById('visualizer');
            
            if (playing) {
                icon.setAttribute('data-lucide', 'pause');
                icon.classList.remove('ml-1');
                visualizer.classList.remove('opacity-0');
            } else {
                icon.setAttribute('data-lucide', 'play');
                icon.classList.add('ml-1');
                visualizer.classList.add('opacity-0');
            }
            lucide.createIcons();
        }

        // Renderização da Lista
        function renderPlaylist() {
            const list = document.getElementById('playlist-items');
            list.innerHTML = '';
            
            sources.forEach((source, index) => {
                const li = document.createElement('li');
                const isActive = index === currentSourceIndex;
                
                li.className = `p-3 hover:bg-white cursor-pointer transition-colors flex justify-between items-center ${isActive ? 'bg-indigo-50' : ''}`;
                li.onclick = () => switchSource(index);
                
                li.innerHTML = `
                    <div>
                        <p class="text-sm font-semibold text-gray-800">${source.name}</p>
                        <p class="text-xs text-gray-500 uppercase">${source.type}</p>
                    </div>
                    ${isActive && isPlaying ? '<span class="text-xs text-indigo-600 font-medium flex items-center gap-1"><span class="w-2 h-2 bg-indigo-600 rounded-full animate-pulse"></span> Tocando</span>' : ''}
                `;
                list.appendChild(li);
            });
        }

        function togglePlaylist() {
            document.getElementById('playlist-drawer').classList.toggle('hidden');
            if(!document.getElementById('playlist-drawer').classList.contains('hidden')) {
                renderPlaylist(); // Atualiza a lista para mostrar o item ativo
            }
        }

        // Inicia
        init();

    </script>
</body>
</html>
