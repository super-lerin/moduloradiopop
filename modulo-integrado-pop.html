<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Rádio Pop Goiaba UFF</title>
    
    <!-- Tailwind CSS -->
   
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="./dist/output.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bar { width: 4px; background: #6366f1; border-radius: 2px; animation: equalize 1s infinite ease-in-out; }
        @keyframes equalize { 0%, 100% { height: 10px; } 50% { height: 25px; } }
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.5s; }
        .bar:nth-child(4) { animation-delay: 0.2s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        .live-pulse { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        audio { transition: volume 0.5s ease; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- PLAYER MODULE -->
    <div id="radio-player-widget" class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-200 relative">
        
        <!-- Header -->
        <div class="relative h-64 bg-gradient-to-br from-indigo-600 to-purple-700 flex flex-col items-center justify-center text-white p-6">
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>

            <div class="relative z-10 mb-4 group cursor-pointer">
                <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white/20 shadow-lg transition-transform duration-500 group-hover:scale-105 bg-indigo-900 flex items-center justify-center">
                    <!-- Logo / Identidade Visual -->
                    <span class="text-3xl font-black tracking-wider text-white">UFF</span>
                </div>
                <div class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full flex items-center gap-1 live-pulse z-20">
                    <span class="w-2 h-2 bg-white rounded-full"></span> AO VIVO
                </div>
            </div>

            <div class="text-center z-10">
                <h2 class="text-xl font-bold tracking-wide" id="station-name">Rádio Pop Goiaba UFF</h2>
                <p class="text-indigo-200 text-sm mt-1" id="stream-status">Carregando stream...</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="p-6 bg-white">
            <div class="mb-6 text-center">
                <h3 class="text-gray-900 font-bold text-lg truncate" id="track-title">Programação Alternativa</h3>
                <p class="text-gray-500 text-sm truncate" id="track-artist">Niterói / RJ - Brasil</p>
            </div>

            <div class="flex items-center justify-center gap-6 mb-6">
                <button onclick="adjustVolume(-0.1)" class="text-gray-400 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-indigo-50" title="Diminuir Volume">
                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                </button>

                <button id="play-btn" class="w-16 h-16 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-200 transition-all transform hover:scale-105 active:scale-95" title="Tocar / Pausar">
                    <i data-lucide="play" class="w-8 h-8 fill-current ml-1" id="play-icon"></i>
                </button>

                <button onclick="adjustVolume(0.1)" class="text-gray-400 hover:text-indigo-600 transition-colors p-2 rounded-full hover:bg-indigo-50" title="Aumentar Volume">
                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="flex items-center gap-3 mb-6 px-2">
                <i data-lucide="volume-1" class="w-4 h-4 text-gray-400"></i>
                <input type="range" min="0" max="1" step="0.01" value="0.8" class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" id="volume-slider">
                <i data-lucide="volume-2" class="w-4 h-4 text-gray-400"></i>
            </div>

            <div id="visualizer" class="h-8 flex items-center justify-center gap-1 mb-4 opacity-0 transition-opacity duration-300">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>

            <div class="flex justify-between border-t border-gray-100 pt-4">
                <button onclick="toggleInfoDrawer()" class="flex items-center gap-2 text-sm text-gray-600 hover:text-indigo-600 transition-colors">
                    <i data-lucide="radio" class="w-4 h-4"></i> Informações da Rádio
                </button>
                <a href="https://radiopopgoiaba.uff.br/" target="_blank" class="flex items-center gap-1 text-xs text-indigo-600 hover:underline">
                    Site Oficial <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
            </div>
        </div>

        <!-- Info Drawer -->
        <div id="info-drawer" class="hidden bg-gray-50 border-t border-gray-200 max-h-60 overflow-y-auto p-4">
            <div id="radio-info-content" class="text-sm text-gray-700 space-y-2">
                <!-- Carregado via PHP/AJAX -->
            </div>
        </div>
    </div>

    <!-- SCRIPT LÓGICO -->
    <script>
        lucide.createIcons();

        let radioData = {};
        let isPlaying = false;
        let masterVolume = 0.8;
        const audioElement = new Audio();

        // Comunicação AJAX com o servidor PHP
        async function initRadioStream() {
            try {
                const response = await fetch('get_playlists.php');
                radioData = await response.json();

                if (!radioData.streamUrl) {
                    document.getElementById('stream-status').innerText = "Stream indisponível";
                    return;
                }

                audioElement.src = radioData.streamUrl;
                audioElement.load();
                audioElement.volume = masterVolume;

                document.getElementById('stream-status').innerText = "Pronto para tocar";
                if(radioData.stationName) {
                    document.getElementById('station-name').innerText = radioData.stationName;
                }
                
                renderRadioInfo();

            } catch (error) {
                console.error("Erro ao carregar dados do servidor:", error);
                document.getElementById('stream-status').innerText = "Erro ao conectar ao servidor";
            }
        }

        audioElement.addEventListener('error', (e) => {
            console.error("Erro no fluxo de áudio:", e);
            document.getElementById('stream-status').innerText = "Erro na transmissão";
            isPlaying = false;
            updateUI(false);
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            if (!audioElement.src) return;

            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                updateUI(false);
                document.getElementById('stream-status').innerText = "Pausado";
            } else {
                document.getElementById('stream-status').innerText = "Conectando ao vivo...";
                audioElement.play().then(() => {
                    isPlaying = true;
                    updateUI(true);
                    document.getElementById('stream-status').innerText = "AO VIVO";
                }).catch(err => {
                    console.error("Erro ao iniciar reprodução:", err);
                    document.getElementById('stream-status').innerText = "Erro ao reproduzir";
                });
            }
        });

        function adjustVolume(change) {
            masterVolume += change;
            if (masterVolume > 1) masterVolume = 1;
            if (masterVolume < 0) masterVolume = 0;
            
            document.getElementById('volume-slider').value = masterVolume;
            audioElement.volume = masterVolume;
        }

        document.getElementById('volume-slider').addEventListener('input', (e) => {
            masterVolume = parseFloat(e.target.value);
            audioElement.volume = masterVolume;
        });

        function updateUI(playing) {
            const icon = document.getElementById('play-icon');
            const visualizer = document.getElementById('visualizer');
            
            if (playing) {
                icon.setAttribute('data-lucide', 'pause');
                icon.classList.remove('ml-1');
                visualizer.classList.remove('opacity-0');
            } else {
                icon.setAttribute('data-lucide', 'play');
                icon.classList.add('ml-1');
                visualizer.classList.add('opacity-0');
            }
            lucide.createIcons();
        }

        function renderRadioInfo() {
            const container = document.getElementById('radio-info-content');
            container.innerHTML = `
                <div class="p-3 bg-white rounded-lg border border-gray-200">
                    <p class="font-bold text-indigo-700 mb-1">📻 Sobre a Rádio</p>
                    <p class="text-xs text-gray-600">${radioData.description || 'Programação musical diversificada com MPB, Rock, Blues, Jazz, Samba e muito mais.'}</p>
                    <p class="text-xs font-semibold text-gray-500 mt-2">Plataforma: ${radioData.serverType || 'Streaming Web'}</p>
                </div>
            `;
        }

        function toggleInfoDrawer() {
            const drawer = document.getElementById('info-drawer');
            drawer.classList.toggle('hidden');
        }

        // Inicializa buscando do servidor PHP
        initRadioStream();
    </script>
</body>
</html>
